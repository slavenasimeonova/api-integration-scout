servers:
  - url: https://sandbox.parcelpost.example/api/alerts/{version}
    description: Sandbox
  - url: https://api.parcelpost.example/api/alerts/{version}
    description: Production
security:
  - oauth2: []
paths:
  /subscription/{type}/package:
    post:
      summary: Create subscriptions by tracking number.
      operationId: subscribePackages
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            examples:
              basic:
                summary: Standard request
                value:
                  trackingNumberList: ["1PP0000000000001"]
                  destination:
                    url: https://example.com/hooks/parcel
                    credentialType: Bearer
                    credential: secret
  webhooks:
  TrackingEvent:
    post:
      summary: Tracking Event
      description: Parcelpost sends this POST to the destination URL for every new tracking event.
      parameters:
        - name: x-api-key
          in: header
          required: false
          schema:
            type: string
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.parcelpost.example/security/v1/oauth/token
          scopes: {}
  schemas:
    SubscriptionRequest:
      type: object
      properties:
        trackingNumberList:
          type: array
    TrackingEventPayload:
      type: object
      properties:
        trackingNumber:
          type: string
        activityStatus:
          type: string
