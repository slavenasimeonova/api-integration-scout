  title: Parcelpost Alerts API
  version: "2"
  description: |

    # Product Info

    Parcelpost Alerts pushes tracking events for subscribed parcels to your webhook.
    Business rule 1: subscriptions last 14 days, and events are delivered at least once in the order they occur.
