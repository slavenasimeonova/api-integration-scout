<!doctype html>
<html lang="en">
<head><title>Rate limits | Acme Weather API</title></head>
<body>
  <main>
    <h1 id="limits">Rate limits</h1>
    <p>Each API key may make
       <strong>60&nbsp;requests per minute</strong>.
       When you exceed the limit the API responds with HTTP 429.</p>
    <p>Check the <code>X-RateLimit-Remaining</code> and
       <code>X-RateLimit-Reset</code> response headers to track usage.</p>
  </main>
</body>
</html>
